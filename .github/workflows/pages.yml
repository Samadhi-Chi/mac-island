name: Mac Island Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-island-pages
  cancel-in-progress: false
jobs:
  prepare:
    # Deliberate first publication only after the source-disclosure review.
    if: github.repository == 'Samadhi-Chi/mac-island' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the public payload
        run: python3 scripts/check-site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
