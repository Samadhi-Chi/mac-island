name: Mac Island Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-island-pages
  cancel-in-progress: false
jobs:
  prepare:
    # Deliberate first publication only after the source-disclosure review.
    if: github.repository == 'Samadhi-Chi/mac-island' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the public payload
        run: python3 scripts/check-site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
